services:
  - type: web
    name: sports-iq
    env: node
    plan: free
    region: oregon
    buildCommand: npm run build
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: USE_MOCK
        value: false
      - key: THESPORTSDB_KEY
        value: 3
      - key: CRICKET_API_KEY
        sync: false
      - key: API_SPORTS_KEY
        sync: false
      - key: ENABLE_AI_ASSISTANT
        value: true
